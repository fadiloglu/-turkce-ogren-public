<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TürkçeÖğren</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1410;--ink2:#4a3f35;--ink3:#8a7a6e;
  --cream:#faf7f2;--cream2:#f2ede4;--cream3:#e8e0d4;
  --gold:#c9934a;--gold2:#e8b070;
  --teal:#2d6e6e;--teal2:#3d8e8e;
  --red:#c94a4a;--green:#4a8a4a;--card:#fff;
  --note-bg:rgba(201,147,74,0.08);--note-border:#c9934a;
  --info-bg:rgba(45,110,110,0.08);--info-border:#2d6e6e;
}
[data-theme="dark"]{
  --ink:#f0ebe4;--ink2:#c8bfb4;--ink3:#8a7a6e;
  --cream:#1a1712;--cream2:#221e1a;--cream3:#2e2a25;
  --card:#1e1b17;--gold:#e8b070;--gold2:#f0c080;
  --teal:#4a9e9e;--teal2:#5ab0b0;
  --note-bg:rgba(201,147,74,0.12);
  --info-bg:rgba(74,158,158,0.12);
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);transition:background .3s,color .3s}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* NAV */
.nav{background:var(--ink);color:var(--cream);padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;transition:background .3s}
.nav-brand{font-family:'Fraunces',serif;font-size:18px;font-weight:700;white-space:nowrap}
.nav-brand span{color:var(--gold2)}
.nav-tabs{display:flex;gap:2px}
.nav-tab{background:none;border:none;color:rgba(250,247,242,0.5);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:5px 12px;border-radius:5px;cursor:pointer;transition:all .2s}
.nav-tab:hover{color:var(--cream);background:rgba(255,255,255,0.08)}
.nav-tab.active{color:var(--ink);background:var(--gold2)}
.nav-right{display:flex;align-items:center;gap:6px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--teal2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:white;flex-shrink:0}
.nav-name{font-size:11px;color:rgba(250,247,242,0.6)}
.btn-sm{background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(250,247,242,0.6);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-sm:hover{border-color:rgba(255,255,255,0.4);color:var(--cream)}

/* LOGIN */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--ink) 0%,#2d2318 50%,var(--teal) 100%);padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
.login-logo{font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin-bottom:6px}
.login-logo span{color:var(--gold)}
.login-sub{color:var(--ink3);font-size:13px;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:500;color:var(--ink2);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.field input{width:100%;padding:11px 13px;border:1.5px solid var(--cream3);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none;transition:border .2s}
.field input:focus{border-color:var(--teal2)}
.btn-login{width:100%;padding:12px;border-radius:6px;background:var(--ink);color:var(--cream);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:background .2s;margin-top:8px}
.btn-login:hover{background:var(--teal)}

/* BODY */
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--cream3);overflow-y:auto;padding:10px;transition:background .3s,border .3s}
.stitle{font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;padding:4px 8px 10px}
.tmain{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink2);transition:background .15s;user-select:none}
.tmain:hover,.tmain.open{background:var(--cream2);color:var(--ink)}
.tnum{font-family:'Fraunces',serif;font-size:11px;color:var(--gold);font-weight:700;min-width:16px}
.chev{margin-left:auto;font-size:10px;color:var(--ink3);transition:transform .2s;display:inline-block;flex-shrink:0}
.tmain.open .chev{transform:rotate(180deg)}
.subs-wrap{padding-left:20px;display:none}
.subs-wrap.open{display:block}
.sub-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:11px;color:var(--ink3);transition:all .15s;gap:5px;line-height:1.4}
.sub-item:hover{background:var(--cream);color:var(--ink2)}
.sub-item.active{background:var(--teal);color:white}
.dot{width:5px;height:5px;border-radius:50%;background:var(--cream3);flex-shrink:0}
.dot.done{background:var(--green)}.dot.mid{background:var(--gold)}

/* PROGRESS BAR */
.sub-prog{height:2px;background:var(--cream3);border-radius:1px;margin-top:3px;overflow:hidden}
.sub-prog-fill{height:100%;border-radius:1px;transition:width .4s ease}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:20px;min-width:0}

/* WELCOME */
.welcome{text-align:center;padding:48px 20px}
.welcome h2{font-family:'Fraunces',serif;font-size:22px;margin-bottom:8px}
.welcome p{font-size:13px;color:var(--ink3);margin-bottom:24px;line-height:1.6}
.stats-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat-c{background:var(--card);border-radius:10px;border:1px solid var(--cream3);padding:14px 22px;text-align:center}
.stat-n{font-family:'Fraunces',serif;font-size:30px;font-weight:700}
.stat-l{font-size:11px;color:var(--ink3);margin-top:3px}

/* TOPIC */
.tc{background:var(--card);border-radius:10px;border:1px solid var(--cream3);overflow:hidden;margin-bottom:16px;transition:background .3s,border .3s}
.tch{background:var(--ink);color:var(--cream);padding:18px 22px}
.tch-sub{font-size:10px;color:var(--gold2);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.tch h2{font-size:17px;line-height:1.3}

/* TOPIC PROGRESS BAR */
.topic-progress-wrap{padding:14px 22px 0;background:var(--ink)}
.topic-progress-bar{height:4px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;margin-bottom:14px}
.topic-progress-fill{height:100%;border-radius:2px;transition:width .6s ease;background:var(--gold2)}
.topic-progress-label{font-size:10px;color:rgba(250,247,242,0.5);margin-bottom:4px;display:flex;justify-content:space-between}

.tcb{padding:20px}
.st{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--cream3)}
.st:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.st-title{font-family:'Fraunces',serif;font-size:14px;color:var(--teal);margin-bottom:8px;font-weight:600}
.def{background:var(--cream);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 5px 5px 0;margin-bottom:8px;transition:background .3s}
.def p{font-size:12px;line-height:1.7;color:var(--ink2);margin-bottom:3px}
.def p:last-child{margin-bottom:0}
.extag{display:inline-block;font-size:10px;background:var(--teal);color:white;padding:2px 8px;border-radius:20px;margin-bottom:5px;font-weight:500}
.extext{font-size:11px;color:var(--ink3);font-style:italic;line-height:1.7}
.extext div{margin-bottom:3px;padding-left:8px;border-left:2px solid var(--cream3)}

/* ÖZEL KUTULAR */
.note-box{background:var(--note-bg);border-left:3px solid var(--note-border);border-radius:0 6px 6px 0;padding:10px 14px;margin:8px 0;display:flex;gap:8px;align-items:flex-start}
.note-box .note-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.note-box .note-text{font-size:11px;line-height:1.7;color:var(--ink2)}
.note-box .note-label{font-size:10px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.info-box{background:var(--info-bg);border-left:3px solid var(--info-border);border-radius:0 6px 6px 0;padding:10px 14px;margin:8px 0;display:flex;gap:8px;align-items:flex-start}
.info-box .note-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.info-box .note-text{font-size:11px;line-height:1.7;color:var(--ink2)}
.info-box .note-label{font-size:10px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}

.qbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:6px;background:var(--teal);color:white;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:none;margin-top:14px;transition:all .2s}
.qbtn:hover:not([disabled]){background:var(--teal2)}
.qbtn[disabled]{opacity:.5;cursor:not-allowed}
.spill{font-size:12px;font-weight:600;margin-left:10px}

/* QUIZ */
.qcard{background:var(--card);border-radius:10px;border:1px solid var(--cream3);overflow:hidden;transition:background .3s}
.qh{background:linear-gradient(135deg,var(--teal),var(--teal2));color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.qh h3{font-size:13px}.qprog{font-size:11px;opacity:.8}
.quiz-progress-bar{height:3px;background:rgba(255,255,255,0.2)}
.quiz-progress-fill{height:100%;background:var(--gold2);transition:width .3s ease}
.qb{padding:20px}
.qnum{font-size:10px;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.qtext{font-size:14px;line-height:1.6;margin-bottom:16px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{padding:10px 14px;border-radius:6px;border:1.5px solid var(--cream3);cursor:pointer;font-size:12px;text-align:left;background:none;font-family:'DM Sans',sans-serif;color:var(--ink2);transition:all .2s;display:flex;gap:10px;align-items:flex-start;width:100%}
.opt:hover:not([disabled]){border-color:var(--teal2);background:var(--cream)}
.opt.sel{border-color:var(--teal);background:rgba(45,110,110,0.06);color:var(--ink)}
.opt.correct{border-color:var(--green);background:rgba(74,138,74,0.08);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(201,74,74,0.06);color:var(--red)}
.optl{font-family:'Fraunces',serif;font-weight:700;font-size:13px;min-width:16px;color:var(--ink3);flex-shrink:0}
.opt.correct .optl{color:var(--green)}.opt.wrong .optl{color:var(--red)}.opt.sel .optl{color:var(--teal)}
.fb{margin-top:12px;padding:10px 14px;border-radius:6px;font-size:12px;line-height:1.6}
.fb.ok{background:rgba(74,138,74,0.08);color:#2d6e2d;border:1px solid rgba(74,138,74,0.2)}
.fb.no{background:rgba(201,74,74,0.06);color:#8a2d2d;border:1px solid rgba(201,74,74,0.15)}
.qact{margin-top:14px;display:flex;gap:8px;justify-content:flex-end}
.bgold{padding:9px 18px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:none;background:var(--gold);color:white;transition:background .2s}
.bgold:hover{background:var(--gold2)}
.bteal{padding:9px 18px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:none;background:var(--teal);color:white;transition:background .2s}
.bteal:hover{background:var(--teal2)}
.bout{background:none;border:1.5px solid var(--cream3);color:var(--ink2);padding:9px 18px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:48px;color:var(--ink3);font-size:13px;flex-direction:column}
.spinner{width:26px;height:26px;border:2px solid var(--cream3);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESULT */
.result-wrap{text-align:center;padding:40px 24px}
.res-score{font-family:'Fraunces',serif;font-size:56px;font-weight:700;line-height:1}
.res-label{font-size:13px;color:var(--ink3);margin-top:6px;margin-bottom:24px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;max-width:280px;margin-left:auto;margin-right:auto}
.bar-track{flex:1;height:6px;background:var(--cream3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}

/* REPORTS */
.rpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.rpm{background:var(--card);border-radius:10px;border:1px solid var(--cream3);padding:14px 18px;transition:background .3s}
.rpl{font-size:11px;color:var(--ink3);margin-bottom:5px;font-weight:500}
.rpv{font-family:'Fraunces',serif;font-size:28px;font-weight:700}
.rpv.t{color:var(--teal)}.rpv.g{color:var(--green)}.rpv.a{color:var(--gold)}.rpv.r{color:var(--red)}
.rps{font-size:11px;color:var(--ink3);margin-top:3px}
.rt{background:var(--card);border-radius:10px;border:1px solid var(--cream3);overflow:hidden;transition:background .3s}
.rth{background:var(--ink);color:var(--cream);display:grid;grid-template-columns:1fr 60px 60px 60px 80px;padding:10px 16px;font-size:10px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.rtr{display:grid;grid-template-columns:1fr 60px 60px 60px 80px;padding:11px 16px;border-bottom:1px solid var(--cream3);font-size:12px;align-items:center;transition:background .15s;cursor:pointer}
.rtr:last-child{border-bottom:none}
.rtr:hover{background:var(--cream)}
.nc{text-align:center}
.pv{text-align:center;font-weight:600}
.pv.hi{color:var(--green)}.pv.mi{color:var(--gold)}.pv.lo{color:var(--red)}
.mb{height:3px;background:var(--cream3);border-radius:2px;overflow:hidden;margin-top:3px}
.mbf{height:100%;border-radius:2px}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.badge.ok{background:rgba(74,138,74,.1);color:var(--green)}
.badge.wa{background:rgba(201,147,74,.15);color:var(--gold)}
.badge.ba{background:rgba(201,74,74,.1);color:var(--red)}
.sectitle{font-family:'Fraunces',serif;font-size:16px;margin-bottom:12px;color:var(--ink)}
.err-box{color:var(--red);font-size:12px;padding:12px 14px;background:rgba(201,74,74,0.06);border-radius:6px;border:1px solid rgba(201,74,74,0.2);margin-bottom:14px}

/* ZAYIF KONU UYARISI */
.weak-alert{background:rgba(201,74,74,0.06);border:1px solid rgba(201,74,74,0.2);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:12px;color:#8a2d2d;cursor:pointer}
.weak-alert:hover{background:rgba(201,74,74,0.1)}

@media(max-width:600px){
  .sidebar{width:180px}
  .rpgrid{grid-template-columns:1fr 1fr}
  .rth,.rtr{grid-template-columns:1fr 44px 44px 44px 60px;padding:8px 10px;font-size:10px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const CONFIG = {
  SHEET_ID: "1OiiiHdx9ZjtOXu_Y-t5Drv76bMJTrgazBQ5XTsl_qww",
  SHEET_NAME: "Sayfa1",
  API_KEY: "AIzaSyDOxuTuuU3Zq8n4RfCp5ExzbaSpXCarSSY",
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let S = {
  screen:'login', user:'', darkMode:false,
  tab:'konular', openMain:null,
  selSub:null, mode:'topic',
  quiz:null, qi:0, qsel:null, qans:false, qres:[],
  progress:{}, topics:[],
  topicsLoading:false, topicsErr:null, lastSync:null
};
try{ const d=JSON.parse(localStorage.getItem('te_v5')||'{}'); S.progress=d.progress||{}; S.darkMode=d.darkMode||false; }catch(e){}
function saveState(){ try{ localStorage.setItem('te_v5',JSON.stringify({progress:S.progress,darkMode:S.darkMode})); }catch(e){} }
const allSubs = () => S.topics.flatMap(t=>t.subs);
const getSub  = id => allSubs().find(s=>s.id===id);
const $       = id => document.getElementById(id);

// ── DARK MODE ─────────────────────────────────────────────────────────────────
function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.darkMode ? 'dark' : '');
}

// ── SHEETS OKUMA ─────────────────────────────────────────────────────────────
// Yeni yapı: Her alt konu için ardışık satır grupları
// Satır tipi A sütununa göre belirlenir:
//   A dolu + B=0 → Ana konu başlığı
//   B dolu       → Alt konu başlığı (C = virgülle ayrılmış başlıklar, D-G = içerik grupları)
// Yeni v2 yapısı: 3 satırlık blok
//   Satır 1: D=Başlık1, E=Başlık2, F=Başlık3, G=Başlık4
//   Satır 2: D=Açıklama1, E=Açıklama2, F=Açıklama3, G=Açıklama4
//   Satır 3: D=Örnek1, E=Örnek2, F=Örnek3, G=Örnek4

async function loadSheets(){
  S.topicsLoading=true; S.topicsErr=null; render();
  try{
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${encodeURIComponent(CONFIG.SHEET_NAME)}?key=${CONFIG.API_KEY}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error(`Sheets API ${res.status}`);
    const data=await res.json();
    S.topics = parseSheets(data.values||[]);
    S.lastSync=new Date().toLocaleTimeString('tr-TR');
    if(S.topics.length>0) S.openMain=S.topics[0].id;
  }catch(e){
    S.topicsErr=e.message;
    S.topics=[];
  }
  S.topicsLoading=false; render();
}

function parseSheets(rows){
  const topics=[];
  let curMain=null;
  let i=0;
  // Header satırını atla (ilk satır)
  // Satırları gezerek yapıyı anla
  for(i=0;i<rows.length;i++){
    const r=rows[i];
    const a=(r[0]||'').trim();
    const b=(r[1]||'').trim();
    const c=(r[2]||'').trim();

    // Ana konu satırı: A sütununda sayı var, B=0 veya boş
    if(a && a!=='Ana Konu Sayısı' && !isNaN(a)){
      curMain={id:`m${a}`,num:a,title:c,subs:[]};
      topics.push(curMain);
      continue;
    }

    // Alt konu satırı: B sütununda sayı var
    if(b && !isNaN(b) && curMain){
      // C sütununda virgülle ayrılmış başlıklar
      const subTitles=c.split(',').map(t=>t.trim()).filter(Boolean);

      // D-G sütunlarından içerik gruplarını çek
      // Yeni yapıda: bu satır başlıklar, bir sonraki açıklamalar, ondan sonraki örnekler
      // Eski yapıda: her hücre kendi içinde başlık+açıklama+örnek içeriyor

      // Hangi yapı olduğunu anla: bir sonraki satırda B boşsa ve içerik varsa yeni yapı
      const nextRow=rows[i+1]||[];
      const nextB=(nextRow[1]||'').trim();
      const nextA=(nextRow[0]||'').trim();

      let contents=[];

      if(!nextB && !nextA && nextRow.length>3){
        // YENİ YAPI: 3 satırlık blok
        const titleRow=r;         // başlıklar
        const descRow=rows[i+1]||[];  // açıklamalar
        const exRow=rows[i+2]||[];    // örnekler

        for(let col=3;col<=6;col++){
          const t=(titleRow[col]||'').trim();
          const d=(descRow[col]||'').trim();
          const ex=(exRow[col]||'').trim();
          if(t||d) contents.push({title:t,desc:d,example:ex});
        }
        i+=2; // 3 satırlık bloğu atla
      } else {
        // ESKİ YAPI: her hücre kendi içinde
        for(let col=3;col<=6;col++){
          const cell=(r[col]||'').trim();
          if(cell) contents.push(parseSingleCell(cell));
        }
      }

      curMain.subs.push({
        id:`s${curMain.num}_${b}`,
        num:b, mNum:curMain.num, mTitle:curMain.title,
        titles:subTitles, contents
      });
    }
  }
  return topics;
}

function parseSingleCell(text){
  // "1. Başlık : açıklama\nÖrnek: ..." formatını parse et
  const titleMatch=text.match(/^\d+\.\s*([^:]+?)\s*[:：]\s*/);
  const title=titleMatch?titleMatch[1].trim():null;
  const rest=titleMatch?text.slice(titleMatch[0].length):text;
  const exIdx=rest.search(/Örnek(?:ler)?[:：\s]/i);
  const desc=exIdx>=0?rest.slice(0,exIdx).trim():rest.trim();
  const example=exIdx>=0?rest.slice(exIdx).trim():'';
  return {title, desc, example};
}

function detectSpecial(text){
  // Önemli Not, Bilgi, Dikkat gibi özel etiketleri algıla
  if(!text) return null;
  if(/^(önemli\s*not|not|dikkat|uyarı)[:\s!]/i.test(text)) return 'note';
  if(/^(bilgi|ipucu|hatırla|püf\s*nok)[:\s!]/i.test(text)) return 'info';
  if(/^⚠|^💡|^ℹ/.test(text)) return text.startsWith('⚠')?'note':'info';
  return null;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  applyTheme();
  const app=$('app'); if(!app) return;
  if(S.screen==='login'){ app.innerHTML=loginHTML(); return; }
  app.innerHTML=appHTML();
}

function loginHTML(){
  return `<div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">Türkçe<span>Öğren</span></div>
      <div class="login-sub">Konu anlatımı, örnekler ve AI destekli testlerle Türkçe'yi pekiştir.</div>
      <div class="field">
        <label>İsminiz</label>
        <input id="li" placeholder="Adınızı girin" onkeydown="if(event.key==='Enter')login()">
      </div>
      <p id="le" style="color:var(--red);font-size:11px;margin-bottom:8px;display:none">Lütfen isminizi girin.</p>
      <button class="btn-login" onclick="login()">Giriş Yap →</button>
      <p style="font-size:11px;color:var(--ink3);margin-top:14px;text-align:center">İlerlemeniz bu tarayıcıda saklanır.</p>
    </div>
  </div>`;
}

function appHTML(){
  return `<nav class="nav">
    <div class="nav-brand">Türkçe<span>Öğren</span></div>
    <div class="nav-tabs">
      <button class="nav-tab ${S.tab==='konular'?'active':''}" onclick="switchTab('konular')">Konular</button>
      <button class="nav-tab ${S.tab==='raporlar'?'active':''}" onclick="switchTab('raporlar')">Raporlarım</button>
    </div>
    <div class="nav-right">
      <div class="avatar">${S.user[0].toUpperCase()}</div>
      <span class="nav-name">${S.user}</span>
      <button class="btn-sm" onclick="loadSheets()" title="Sheets'ten yenile">↻</button>
      <button class="btn-sm" onclick="toggleDark()">${S.darkMode?'☀':'🌙'}</button>
      <button class="btn-sm" onclick="logout()">Çıkış</button>
    </div>
  </nav>
  <div class="body">
    <aside class="sidebar">${sidebarHTML()}</aside>
    <main class="content">${S.tab==='konular'?mainHTML():reportsHTML()}</main>
  </div>`;
}

function sidebarHTML(){
  if(S.topicsLoading) return `<div class="loading" style="padding:24px"><div class="spinner"></div></div>`;
  let h=`<div class="stitle">Konular</div>`;
  if(S.lastSync) h+=`<div style="font-size:10px;color:var(--green);padding:0 8px 8px;display:flex;align-items:center;gap:4px">
    <span style="width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0"></span>
    Güncellendi: ${S.lastSync}</div>`;
  if(S.topicsErr) h+=`<div style="font-size:10px;color:var(--gold);padding:0 8px 10px">⚠ ${S.topicsErr}</div>`;

  h+=S.topics.map(t=>{
    const open=S.openMain===t.id;
    return `<div>
      <div class="tmain ${open?'open':''}" onclick="toggleMain('${t.id}')">
        <span class="tnum">${t.num}.</span>
        <span style="flex:1">${t.title}</span>
        <span class="chev">▾</span>
      </div>
      <div class="subs-wrap ${open?'open':''}">
        ${t.subs.map(s=>{
          const p=S.progress[s.id]||{};
          const pct=p.solved?Math.round(p.correct/p.solved*100):0;
          const dc=!p.solved?'':(p.correct/p.solved)>=0.7?'done':'mid';
          const progColor=pct>=70?'var(--green)':pct>=40?'var(--gold)':'var(--red)';
          return `<div class="sub-item ${S.selSub===s.id?'active':''}" onclick="selSub('${s.id}')">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:4px">
                <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.titles[0]}</span>
                <span class="dot ${dc}" style="flex-shrink:0"></span>
              </div>
              ${p.solved?`<div class="sub-prog"><div class="sub-prog-fill" style="width:${pct}%;background:${S.selSub===s.id?'white':progColor}"></div></div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  return h;
}

function mainHTML(){
  if(S.topicsLoading) return `<div class="loading"><div class="spinner"></div><span>Yükleniyor…</span></div>`;
  if(!S.selSub){
    const as=allSubs();
    const solved=Object.keys(S.progress).filter(k=>S.progress[k].solved>0).length;
    const good=Object.values(S.progress).filter(p=>p.solved>0&&(p.correct/p.solved)>=0.7).length;
    // Zayıf konu uyarısı
    const weakTopics=allSubs().filter(s=>{
      const p=S.progress[s.id]||{};
      return p.solved>0&&(p.correct/p.solved)<0.5;
    });
    let weakHtml='';
    if(weakTopics.length>0){
      weakHtml=weakTopics.map(s=>`<div class="weak-alert" onclick="selSub('${s.id}')">
        <span>⚠</span>
        <span><strong>${s.titles[0]}</strong> konusunda %${Math.round((S.progress[s.id].correct/S.progress[s.id].solved)*100)} başarı — tekrar etmek ister misin?</span>
        <span style="margin-left:auto;font-size:11px;color:var(--red)">→</span>
      </div>`).join('');
    }
    return `<div class="welcome">
      <h2>Merhaba, ${S.user}!</h2>
      <p>Soldan bir konu seçerek anlatımı oku,<br>sonra AI destekli test çöz.</p>
      ${weakHtml}
      <div class="stats-row">
        <div class="stat-c"><div class="stat-n" style="color:var(--teal)">${as.length}</div><div class="stat-l">Alt Konu</div></div>
        <div class="stat-c"><div class="stat-n" style="color:var(--gold)">${solved}</div><div class="stat-l">Test Çözülen</div></div>
        <div class="stat-c"><div class="stat-n" style="color:var(--green)">${good}</div><div class="stat-l">İyi Puan (%70+)</div></div>
      </div>
    </div>`;
  }
  if(S.mode==='quiz') return quizHTML();
  if(S.mode==='result') return resultHTML();
  return topicHTML();
}

function topicHTML(){
  const sub=getSub(S.selSub); if(!sub) return '';
  const p=S.progress[sub.id]||{};
  const pct=p.solved?Math.round(p.correct/p.solved*100):0;
  const pc=pct>=70?'var(--green)':pct>=40?'var(--gold)':'var(--red)';
  const totalQ=p.solved||0;

  let h=`<div class="tc"><div class="tch">
    <div class="tch-sub">${sub.mNum}.${sub.num} · ${sub.mTitle}</div>
    <h2>${sub.titles.join(' · ')}</h2>
  </div>`;

  // İlerleme çubuğu (daha önce test çözdüyse)
  if(totalQ>0){
    h+=`<div class="topic-progress-wrap">
      <div class="topic-progress-label">
        <span>İlerleme</span>
        <span style="color:var(--gold2)">${p.correct}/${totalQ} doğru · %${pct}</span>
      </div>
      <div class="topic-progress-bar">
        <div class="topic-progress-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
  }

  h+=`<div class="tcb">`;

  sub.contents.forEach(c=>{
    if(!c) return;
    const {title,desc,example}=c;

    // Özel kutu kontrolü
    const descSpecial=detectSpecial(desc);
    const titleSpecial=detectSpecial(title);
    const special=titleSpecial||descSpecial;

    h+=`<div class="st">`;

    if(title && !special){
      h+=`<div class="st-title">${title}</div>`;
    }

    if(special==='note'){
      h+=`<div class="note-box">
        <span class="note-icon">⚠️</span>
        <div class="note-text">
          <div class="note-label">Önemli Not</div>
          ${title&&titleSpecial?'':title?`<strong>${title}</strong><br>`:''}
          ${desc}
        </div>
      </div>`;
    } else if(special==='info'){
      h+=`<div class="info-box">
        <span class="note-icon">💡</span>
        <div class="note-text">
          <div class="note-label">Bilgi</div>
          ${title&&titleSpecial?'':title?`<strong>${title}</strong><br>`:''}
          ${desc}
        </div>
      </div>`;
    } else if(desc){
      h+=`<div class="def"><p>${desc.replace(/\n/g,'</p><p>')}</p></div>`;
    }

    if(example){
      h+=`<span class="extag">Örnekler</span>
        <div class="extext">
          ${example.split('\n').filter(Boolean).map(l=>`<div>${l}</div>`).join('')}
        </div>`;
    }
    h+=`</div>`;
  });

  h+=`<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px">
    <button class="qbtn" onclick="startQuiz()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      AI Test Çöz
    </button>
    ${totalQ>0?`<span class="spill" style="color:${pc}">Son: ${p.correct}/${totalQ} (%${pct})</span>`:''}
  </div></div></div>`;
  return h;
}

function quizHTML(){
  if(!S.quiz) return `<div class="qcard"><div class="loading"><div class="spinner"></div><span>Claude sorular hazırlıyor…</span></div></div>`;
  const q=S.quiz.questions[S.qi], L=['A','B','C','D','E'];
  const progPct=Math.round((S.qi/S.quiz.questions.length)*100);
  let h=`<div class="qcard">
    <div class="qh">
      <h3>${getSub(S.selSub)?.titles[0]}</h3>
      <span class="qprog">Soru ${S.qi+1} / ${S.quiz.questions.length}</span>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progPct}%"></div></div>
    <div class="qb">
      <div class="qnum">Soru ${S.qi+1}</div>
      <div class="qtext">${q.question}</div>
      <div class="opts">`;
  q.options.forEach((o,i)=>{
    let cls='opt';
    if(S.qans){if(i===q.correct)cls+=' correct';else if(i===S.qsel)cls+=' wrong';}
    else if(i===S.qsel)cls+=' sel';
    h+=`<button class="${cls}" onclick="selOpt(${i})" ${S.qans?'disabled':''}><span class="optl">${L[i]}</span><span>${o}</span></button>`;
  });
  h+=`</div>`;
  if(S.qans){
    const ok=S.qres[S.qres.length-1]?.correct;
    h+=`<div class="fb ${ok?'ok':'no'}">${ok?'✓ Doğru! ':'✗ Yanlış. '}${q.explanation}</div>`;
  }
  h+=`<div class="qact">`;
  if(!S.qans) h+=`<button class="bteal" onclick="confirmOpt()" ${S.qsel===null?'disabled':''}>Cevapla</button>`;
  else h+=`<button class="bgold" onclick="nextQ()">${S.qi+1>=S.quiz.questions.length?'Sonuçları Gör →':'Sonraki Soru →'}</button>`;
  h+=`</div></div></div>`;
  return h;
}

function resultHTML(){
  const cor=S.qres.filter(r=>r.correct).length, tot=S.qres.length;
  const pct=Math.round(cor/tot*100);
  const col=pct>=70?'var(--green)':pct>=40?'var(--gold)':'var(--red)';
  const msg=pct>=70?'Harika! Konuyu iyi öğrendin 🎉':pct>=40?'İyi gidiyorsun, biraz daha pratik yap 💪':'Tekrar etmeni öneririm, kafanı karıştıran konuları oku 📚';
  return `<div class="qcard"><div class="result-wrap">
    <div class="res-score" style="color:${col}">${pct}%</div>
    <div class="res-label">${cor} / ${tot} doğru · ${getSub(S.selSub)?.titles[0]}</div>
    <p style="font-size:12px;color:var(--ink3);margin-bottom:20px">${msg}</p>
    <div class="bar-row">
      <span style="width:48px;color:var(--green);font-weight:500">Doğru</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--green)"></div></div>
      <span style="width:16px;text-align:right;font-weight:600;color:var(--green)">${cor}</span>
    </div>
    <div class="bar-row">
      <span style="width:48px;color:var(--red);font-weight:500">Yanlış</span>
      <div class="bar-track"><div class="bar-fill" style="width:${100-pct}%;background:var(--red)"></div></div>
      <span style="width:16px;text-align:right;font-weight:600;color:var(--red)">${tot-cor}</span>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px">
      <button class="bteal" onclick="backTopic()">Konuya Dön</button>
      <button class="bgold" onclick="startQuiz()">Yeni Sorularla Tekrar</button>
    </div>
  </div></div>`;
}

function reportsHTML(){
  const as=allSubs();
  const ts=Object.values(S.progress).reduce((s,p)=>s+(p.solved||0),0);
  const tc=Object.values(S.progress).reduce((s,p)=>s+(p.correct||0),0);
  const att=Object.keys(S.progress).filter(k=>S.progress[k].solved>0).length;
  const pct=ts>0?Math.round(tc/ts*100):0;
  const good=Object.values(S.progress).filter(p=>p.solved>0&&(p.correct/p.solved)>=0.7).length;
  const ns=as.filter(s=>!S.progress[s.id]?.solved).length;

  const rows=S.topics.map(t=>{
    const sol=t.subs.reduce((s,sub)=>s+(S.progress[sub.id]?.solved||0),0);
    const cor=t.subs.reduce((s,sub)=>s+(S.progress[sub.id]?.correct||0),0);
    const p=sol>0?Math.round(cor/sol*100):null;
    return{t,sol,cor,p};
  }).filter(r=>r.sol>0).sort((a,b)=>(a.p||0)-(b.p||0));

  // Alt konu bazlı detay
  const subRows=as.filter(s=>S.progress[s.id]?.solved>0).map(s=>{
    const p=S.progress[s.id];
    const pct=Math.round(p.correct/p.solved*100);
    return{s,p,pct};
  }).sort((a,b)=>a.pct-b.pct);

  let h=`<div class="rpgrid">
    <div class="rpm"><div class="rpl">Toplam Çözülen</div><div class="rpv t">${ts}</div><div class="rps">${att} konudan</div></div>
    <div class="rpm"><div class="rpl">Genel Başarı</div><div class="rpv ${pct>=70?'g':pct>=40?'a':'r'}">${pct}%</div><div class="rps">${tc} doğru / ${ts-tc} yanlış</div></div>
    <div class="rpm"><div class="rpl">Başlanmamış Konu</div><div class="rpv a">${ns}</div><div class="rps">${as.length} konudan</div></div>
    <div class="rpm"><div class="rpl">İyi Puan (%70+)</div><div class="rpv g">${good}</div><div class="rps">konu tamamlandı</div></div>
  </div>`;

  if(subRows.length>0){
    h+=`<div class="sectitle" style="margin-top:8px">Alt Konu Detayı</div><div class="rt">
      <div class="rth"><span>Konu</span><span class="nc">Çözülen</span><span class="nc">Doğru</span><span class="nc">%</span><span class="nc">Durum</span></div>
      ${subRows.map(({s,p,pct})=>`<div class="rtr" onclick="selSubFromReport('${s.id}')">
        <div>
          <span style="font-weight:500;font-size:11px">${s.mTitle} › ${s.titles[0]}</span>
          <div class="mb"><div class="mbf" style="width:${pct}%;background:${pct>=70?'var(--green)':pct>=40?'var(--gold)':'var(--red)'}"></div></div>
        </div>
        <div class="nc">${p.solved}</div>
        <div class="nc">${p.correct}</div>
        <div class="pv ${pct>=70?'hi':pct>=40?'mi':'lo'}">${pct}%</div>
        <div class="nc"><span class="badge ${pct>=70?'ok':pct>=40?'wa':'ba'}">${pct>=70?'İyi':pct>=40?'Geliştir':'Zayıf'}</span></div>
      </div>`).join('')}
    </div>`;
  } else {
    h+=`<div style="text-align:center;padding:36px;color:var(--ink3);background:var(--card);border-radius:10px;border:1px solid var(--cream3);font-size:13px">
      Henüz test çözmedin. Bir konu seçip AI testini dene!
    </div>`;
  }
  return h;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function login(){
  const v=$('li')?.value?.trim();
  if(!v){$('le').style.display='block';return;}
  S.user=v; S.screen='app';
  loadSheets();
}
function logout(){ S.screen='login'; S.user=''; S.selSub=null; S.mode='topic'; render(); }
function switchTab(t){ S.tab=t; render(); }
function toggleMain(id){ S.openMain=S.openMain===id?null:id; render(); }
function selSub(id){ S.selSub=id; S.mode='topic'; S.quiz=null; S.qi=0; S.qsel=null; S.qans=false; S.qres=[]; S.tab='konular'; render(); }
function selSubFromReport(id){ S.selSub=id; S.tab='konular'; S.mode='topic'; render(); }
function backTopic(){ S.mode='topic'; render(); }
function selOpt(i){ if(S.qans)return; S.qsel=i; render(); }
function toggleDark(){ S.darkMode=!S.darkMode; saveState(); render(); }
function confirmOpt(){
  if(S.qsel===null)return;
  const ok=S.qsel===S.quiz.questions[S.qi].correct;
  S.qres.push({correct:ok}); S.qans=true; render();
}
function nextQ(){
  S.qi++; S.qsel=null; S.qans=false;
  if(S.qi>=S.quiz.questions.length){
    const cor=S.qres.filter(r=>r.correct).length, tot=S.qres.length;
    const prev=S.progress[S.selSub]||{solved:0,correct:0};
    S.progress[S.selSub]={solved:prev.solved+tot,correct:prev.correct+cor};
    saveState(); S.mode='result';
  }
  render();
}

async function startQuiz(){
  S.mode='quiz'; S.quiz=null; S.qi=0; S.qsel=null; S.qans=false; S.qres=[];
  render();
  const sub=getSub(S.selSub);
  // İçerik özetini hazırla
  const contentSummary=sub.contents.map(c=>{
    if(!c) return '';
    const parts=[];
    if(c.title) parts.push(c.title);
    if(c.desc) parts.push(c.desc);
    if(c.example) parts.push('Örnek: '+c.example);
    return parts.join('\n');
  }).join('\n\n');

  const prompt=`Sen bir Türkçe dil bilgisi öğretmenisin. Aşağıdaki konu hakkında 5 soruluk çoktan seçmeli test hazırla.

Konu: ${sub.mTitle} > ${sub.titles.join(", ")}
İçerik:
${contentSummary}

KURALLAR:
- Her soruda tam 5 şık olmalı (A,B,C,D,E)
- Her seferinde farklı sorular üret, öncekilerden farklı ol
- Hem kavram hem örnek üzerinden sorular sor
- Açıklama kısa ve öğretici olsun (1-2 cümle)
- SADECE JSON döndür, markdown veya başka hiçbir şey yazma

{"questions":[{"question":"...","options":["A...","B...","C...","D...","E..."],"correct":0,"explanation":"..."}]}`;

  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:prompt}]})
    });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    const txt=d.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
    S.quiz=JSON.parse(txt); render();
  }catch(e){
    S.mode='topic'; render();
    setTimeout(()=>{
      const c=document.querySelector('.content');
      if(c){const div=document.createElement('div');div.className='err-box';div.style.marginBottom='16px';div.textContent=`Sorular üretilemedi: ${e.message}`;c.prepend(div);}
    },50);
  }
}

render();
</script>

</html>
